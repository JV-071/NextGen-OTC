; Optional public overrides. Defaults match this NextGen build.
; Account and character settings are stored separately in config.otml.
[graphics]
; gl is the portable renderer. Alternative backends are experimental and
; depend on the platform and on how the executable was compiled.
renderBackend = gl
; frame keeps the established frame-buffer rendering path.
renderPath = frame
maxAtlasSize = 8192
mapAtlasSize = 0
foregroundAtlasSize = 2048

; Uncomment any value to override a registered game font. This uses the same
; public keys as OTBR while preserving NextGen's current visual defaults.
[font]
; widget = verdana-bold|10|0|black
; static-text = verdana-11px-rounded
; animated-text = verdana-11px-rounded
; creature-text = verdana-11px-rounded
; item-count = verdana-10px-rounded
