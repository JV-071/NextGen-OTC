name: Build - Windows

on:
  workflow_dispatch:
    inputs:
      include_runtime:
        description: Also upload data, modules and default config as a separate package
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "tests/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/build-windows.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read
  pull-requests: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  MAKEFLAGS: "-j 2"
  # Keep compiled vcpkg packages in a normal filesystem cache. This avoids the
  # unavailable x-gha runtime token and lets failed runs reuse dependencies.
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: windows-2022-release
    runs-on: windows-2022

    concurrency:
      group: nextgen-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get vcpkg commit ID
        id: vcpkg-step
        shell: pwsh
        run: |
          $json = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $commit = $json.'builtin-baseline'
          echo "vcpkgGitCommitId=$commit" >> $env:GITHUB_OUTPUT

      - name: Validate vcpkg baseline SHA
        shell: pwsh
        run: |
          $SHAS = "${{ steps.vcpkg-step.outputs.vcpkgGitCommitId }}"
          if ([string]::IsNullOrEmpty($SHAS)) {
            echo "::error title=Missing vcpkg baseline::Provide a full 40-char vcpkgGitCommitId."
            exit 1
          }
          if ($SHAS -notmatch '^[0-9a-f]{40}$') {
            echo "::error title=Invalid vcpkg baseline::vcpkgGitCommitId must be a full 40-char commit SHA."
            exit 1
          }

      - name: Compute vcpkg.json hash
        id: hash
        shell: pwsh
        run: |
          $json = Get-Content "vcpkg.json" -Raw -Encoding UTF8
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          $hashBytes = $sha256.ComputeHash($bytes)
          $hash = [BitConverter]::ToString($hashBytes) -replace '-', ''
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache vcpkg artifacts
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ github.workspace }}/.vcpkg-binary-cache
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-windows-x64-static-${{ hashFiles('vcpkg.json') }}-complete-v1
          restore-keys: |
            vcpkg-windows-x64-static-${{ hashFiles('vcpkg.json') }}-
            vcpkg-windows-x64-static-
            vcpkg-windows-release-v2-
            vcpkg-windows-release-

      - name: Compiler cache (sccache)
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          max-size: "1G"
          variant: "sccache"
          key: ccache-windows-release
          restore-keys: |
            ccache-windows-release

      - name: Remove Windows pre-installed MySQL (for clean builds)
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:/mysql*"

      - name: Install vcpkg
        uses: lukka/run-vcpkg@a400452f634fe49e9f18d388aeb1809dcc642136
        with:
          vcpkgGitCommitId: ${{ steps.vcpkg-step.outputs.vcpkgGitCommitId }}

      - name: Get latest CMake and Ninja
        uses: lukka/get-cmake@v3.31.6

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare persistent vcpkg binary cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\.vcpkg-binary-cache" | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$env:GITHUB_WORKSPACE/.vcpkg-binary-cache" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$env:GITHUB_WORKSPACE/.vcpkg-binary-cache,readwrite" >> $env:GITHUB_ENV

      - name: Configure and Build
        id: compile
        shell: pwsh
        continue-on-error: true
        run: |
          $log = "$env:GITHUB_WORKSPACE\windows-build.log"
          cmake --preset windows-release *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-release *>&1 | Tee-Object -FilePath $log -Append
          exit $LASTEXITCODE

      - name: Save completed vcpkg work
        if: ${{ always() && steps.compile.outcome != 'skipped' && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ github.workspace }}/.vcpkg-binary-cache
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-windows-x64-static-${{ hashFiles('vcpkg.json') }}-${{ steps.compile.outcome == 'success' && 'complete-v1' || format('{0}-{1}', github.run_id, github.run_attempt) }}

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: NextGen-OTC-windows-build-log
          path: |
            ${{ github.workspace }}/windows-build.log
            ${{ github.workspace }}/build/windows-release/vcpkg-manifest-install.log
            ${{ github.workspace }}/vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

      - name: Report build failure
        if: ${{ steps.compile.outcome == 'failure' }}
        shell: pwsh
        run: |
          $log = "$env:GITHUB_WORKSPACE\windows-build.log"
          if (Test-Path $log) {
            $lines = @(Get-Content $log -Tail 120)
            for ($offset = 0; $offset -lt $lines.Count; $offset += 30) {
              $end = [Math]::Min($offset + 29, $lines.Count - 1)
              $text = ($lines[$offset..$end] -join "`n")
              $text = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              $part = [int]($offset / 30) + 1
              Write-Output "::error title=Windows build log part $part::$text"
            }
          }
          Write-Error "Windows build failed. See the annotations or download NextGen-OTC-windows-build-log."
          exit 1

      - name: Test bestiary protocol layouts
        shell: pwsh
        run: ctest --test-dir build/windows-release -R '^BestiaryOverview\.' --output-on-failure --no-tests=error

      - name: Prepare artifact folder
        shell: pwsh
        run: |
          $artifactDir = "$env:GITHUB_WORKSPACE\artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          # The client target writes to the repository root when
          # TOGGLE_BIN_FOLDER is disabled. A recursive search under build/
          # can select otclient_*_tests.exe from vcpkg instead; that binary
          # only runs GoogleTest and exits immediately.
          $exeCandidates = @(
            "$env:GITHUB_WORKSPACE\otclient.exe",
            "$env:GITHUB_WORKSPACE\build\windows-release\bin\otclient.exe"
          )
          $exePath = $exeCandidates |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1 |
            ForEach-Object { Get-Item -LiteralPath $_ }

          if (-not $exePath) {
            Write-Error "Main otclient.exe not found in the expected output locations."
            exit 1
          }

          Copy-Item $exePath.FullName -Destination "$artifactDir\NextGen-OTC.exe"

          $dlls = Get-ChildItem -Path $exePath.Directory.FullName -Filter "*.dll"
          foreach ($dll in $dlls) {
            Copy-Item $dll.FullName -Destination $artifactDir
          }

          # Match the upstream binary-only artifact. ILK is optional: it only
          # exists for incremental links and is not required to run the client.
          foreach ($extension in @('pdb', 'ilk')) {
            $symbol = Join-Path $exePath.Directory.FullName "otclient.$extension"
            if (Test-Path -LiteralPath $symbol) {
              Copy-Item -LiteralPath $symbol -Destination $artifactDir
            } elseif ($extension -eq 'pdb') {
              throw 'Matching otclient.pdb not found beside the executable.'
            }
          }

      - name: Prepare optional runtime package
        if: ${{ inputs.include_runtime }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime | Out-Null
          foreach ($item in @('init.lua', 'config.ini', 'data', 'modules', 'mods')) {
            if (Test-Path -LiteralPath $item) {
              Copy-Item -LiteralPath $item -Destination runtime -Recurse -Force
            }
          }

      - name: Validate Windows executable and runtime linkage
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE\artifacts\NextGen-OTC.exe"
          $headers = & dumpbin.exe /nologo /headers $exe
          if ($LASTEXITCODE -ne 0 -or @($headers -match 'machine \(x64\)').Count -eq 0) {
            throw 'Packaged executable is not a valid x64 PE image.'
          }

          $imports = & dumpbin.exe /nologo /dependents $exe
          if ($LASTEXITCODE -ne 0) {
            throw 'dumpbin failed while checking executable dependencies.'
          }
          $dynamicRuntime = @($imports | Where-Object { $_ -match '(vcruntime|msvcp|concrt)[0-9_]*\.dll' })
          if ($dynamicRuntime.Count -gt 0) {
            throw "Static package unexpectedly imports the dynamic MSVC runtime: $($dynamicRuntime -join ', ')"
          }

      - name: Upload optional runtime package
        if: ${{ inputs.include_runtime }}
        uses: actions/upload-artifact@v7
        with:
          name: NextGen-OTC-runtime
          path: runtime
          if-no-files-found: error

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: NextGen-OTC-windows-release
          path: ${{ github.workspace }}/artifacts

  release:
    name: Publish "latest" release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nextgen-release-latest
      cancel-in-progress: false

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: NextGen-OTC-windows-release
          path: artifacts

      - name: Zip binaries
        run: cd artifacts && zip -r ../NextGen-OTC-windows.zip .

      - name: Update "latest" release without deleting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A newer push may change workflows while this build is running.
          # Do not publish stale code or delete the previous release in that case.
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo 'A newer main commit exists; keeping this build as an Actions artifact.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/latest -f sha="$GITHUB_SHA" >/dev/null
          fi
          title="Latest build ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})"
          notes="Automatic build of the latest \`main\` commit ${GITHUB_SHA::7}.

          Binary-only update: executable, matching debug symbols and any required DLLs. Install into an existing NextGen client with init.lua, data, modules and mods. Game assets remain separate. For a fresh installation, the optional runtime package can be generated with workflow_dispatch (include_runtime)."
          if gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit latest -R "$GITHUB_REPOSITORY" --prerelease --title "$title" --notes "$notes"
          else
            gh release create latest -R "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "$title" --notes "$notes"
          fi
          gh release upload latest NextGen-OTC-windows.zip -R "$GITHUB_REPOSITORY" --clobber
